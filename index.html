<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Kazakh History</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app header, offline banner, then content (tabs) beside a sticky "PWA lab" card; stacks with the lab first on phones. */
:root{
  --bg:#EDF2F5; --surface:#FFFFFF; --surface2:#F4F8FA; --ink:#0E2433; --muted:#4F6575; --line:#D3DEE5;
  --accent:#066F8A; --sky:#0A8FB0; --on-accent:#FFFFFF; --gold:#D9980F; --gold-soft:#FBF0CC;
  --ok:#1B7A4B; --warn:#9A4A12; --warn-bg:#FCE9D6; --danger:#B3372F; --danger-bg:#FBE3E1;
  --shadow:0 1px 2px rgba(14,36,51,.06),0 6px 20px rgba(14,36,51,.06);
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-display:"Noto Serif",Georgia,"Times New Roman",serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08151D; --surface:#0F2530; --surface2:#14303D; --ink:#E7F1F6; --muted:#9DB5C2; --line:#23414F;
  --accent:#4CC3E0; --sky:#4CC3E0; --on-accent:#05202B; --gold:#F0B93A; --gold-soft:#3A3118;
  --ok:#5BD08F; --warn:#F3A25E; --warn-bg:#3A2616; --danger:#F27D7D; --danger-bg:#3C1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08151D; --surface:#0F2530; --surface2:#14303D; --ink:#E7F1F6; --muted:#9DB5C2; --line:#23414F;
  --accent:#4CC3E0; --sky:#4CC3E0; --on-accent:#05202B; --gold:#F0B93A; --gold-soft:#3A3118;
  --ok:#5BD08F; --warn:#F3A25E; --warn-bg:#3A2616; --danger:#F27D7D; --danger-bg:#3C1D1D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto}

/* header */
header.app{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px}
header.app .brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 260px}
header.app svg.icon{width:44px;height:44px;flex:none;border-radius:11px}
h1{font-family:var(--font-display);font-size:22px;line-height:1.2;margin:0;text-wrap:balance}
.tag{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:52ch}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.pill.off i{background:var(--warn)}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;margin-bottom:16px}

/* layout */
.layout{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
.lab{order:-1}
@media (min-width:920px){.layout{grid-template-columns:minmax(0,1fr) 370px;align-items:start}.lab{order:0;position:sticky;top:16px}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.main{padding:18px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:-4px -4px 18px;padding:0 4px 12px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:none;padding:8px 16px;border-radius:10px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface2);border-color:var(--line);color:var(--ink)}

/* timeline */
.tl{margin:0;padding:0 0 0 22px;list-style:none;border-left:2px solid var(--line);margin-left:6px;display:grid;gap:20px}
.tl li{position:relative;min-width:0}
.tl li::before{content:"";position:absolute;left:-30px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--gold);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--gold)}
.yr{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--warn);letter-spacing:.02em}
:root[data-theme="dark"] .yr{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .yr{color:var(--gold)}}
.tl h3,.fig h3{font-family:var(--font-display);font-size:18px;margin:2px 0 4px;line-height:1.3}
.tl p,.fig p{margin:0;color:var(--muted);max-width:62ch}

/* figures */
.figs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}
.fig{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.mono{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:20px;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);justify-self:start}
.life{font-family:var(--font-mono);font-size:12.5px;color:var(--muted)}

/* quiz */
.quiz{display:grid;gap:14px;max-width:620px}
.quiz .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-weight:600}
.quiz h3{font-family:var(--font-display);font-size:20px;margin:0;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:500}
.opt:hover:not(:disabled){border-color:var(--sky)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.wrong{border-color:var(--danger);background:var(--danger-bg)}
.fb{font-weight:600;min-height:1.5em}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--danger)}

.btn{border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#241A02}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.small{padding:5px 10px;font-size:12.5px}

/* states */
.skel{display:grid;gap:12px}
.skel i{display:block;height:16px;border-radius:6px;background:linear-gradient(90deg,var(--line),var(--surface2),var(--line));background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.fail{display:grid;gap:10px;justify-items:start;padding:22px;border:1.5px dashed var(--warn);border-radius:14px;background:var(--warn-bg);color:var(--ink)}
.fail h3{margin:0;font-family:var(--font-display);color:var(--warn)}
.fail p{margin:0;max-width:52ch}

/* lab */
.lab-in{padding:16px;display:grid;gap:18px}
.lab h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0}
.block{display:grid;gap:10px}
.block h3{margin:0;font-size:16px}
.block p{margin:0;color:var(--muted);font-size:13.5px}
.block+.block{border-top:1px solid var(--line);padding-top:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sky);transition:width .35s}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .2s}
.switch input:checked+.trk{background:var(--warn)}
.switch input:checked+.trk::after{transform:translateX(18px)}
.switch input:focus-visible+.trk{outline:3px solid var(--sky);outline-offset:2px}
.entries{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.entries li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;background:var(--surface2);border-radius:8px;border:1px solid var(--line)}
.entries code,.log code,pre{font-family:var(--font-mono)}
.entries span:last-child{color:var(--muted)}
.log{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:12px;max-height:190px;overflow:auto}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:8px;background:var(--surface2)}
.log time{color:var(--muted);font-family:var(--font-mono)}
.log code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{font-weight:700;font-size:10.5px;letter-spacing:.05em;padding:2px 7px;border-radius:6px}
.src.network{background:color-mix(in srgb,var(--sky) 22%,var(--surface));color:var(--accent)}
.src.cache{background:var(--gold-soft);color:var(--warn)}
:root[data-theme="dark"] .src.cache{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .src.cache{color:var(--gold)}}
.src.fail{background:var(--danger-bg);color:var(--danger)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:13px}
.checks li::before{content:"✓";color:var(--ok);font-weight:700;margin-right:8px}
.note{font-size:12.5px;color:var(--muted);margin:0}
details summary{cursor:pointer;font-weight:600;font-size:14px}
pre{margin:8px 0 0;padding:12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:11.5px;line-height:1.5;overflow-x:auto;white-space:pre}

/* home screen mock */
.home{border-radius:18px;padding:14px;background:linear-gradient(160deg,#0A8FB0,#0E2433);display:grid;gap:12px;color:#fff}
.home .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center}
.home .app{display:grid;gap:4px;justify-items:center;font-size:11px;background:none;border:0;color:#fff;padding:0;min-width:0}
.home .app span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home .ph{width:44px;height:44px;border-radius:11px;background:rgba(255,255,255,.22)}
.home svg{width:44px;height:44px;border-radius:11px}
.home .app.new svg{box-shadow:0 0 0 3px #FFD76A;animation:pop .6s ease-out}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.home small{opacity:.85;text-align:center}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(5,16,24,.62);display:grid;place-items:center;padding:16px;z-index:40}
.sheet{width:min(380px,100%);background:var(--surface);border-radius:20px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.45);border:1px solid var(--line)}
.sheet .top{display:flex;gap:14px;align-items:center}
.sheet svg{width:60px;height:60px;border-radius:14px;flex:none}
.sheet h2{font-family:var(--font-display);font-size:18px;margin:0;line-height:1.3}
.sheet .url{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.sheet p{margin:0;color:var(--muted)}
.sheet .row{justify-content:flex-end}
.phone{width:min(390px,100%);height:min(760px,100%);background:var(--bg);border-radius:34px;border:8px solid #111;overflow:hidden;display:flex;flex-direction:column;position:relative}
.sbar{display:flex;justify-content:space-between;padding:8px 18px;font-size:12px;font-weight:700;background:var(--sky);color:#fff;flex:none}
.splash{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:14px;background:#0E2433;color:#fff;z-index:2;text-align:center;font-family:var(--font-display);font-size:18px;transition:opacity .4s}
.splash svg{width:84px;height:84px;border-radius:20px}
.splash.gone{opacity:0;pointer-events:none}
.sapp{padding:14px;overflow:auto;flex:1;display:grid;gap:14px;align-content:start}
.sapp header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sapp h2{font-family:var(--font-display);font-size:19px;margin:0}
.stl{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.stl li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stl b{display:block;font-family:var(--font-display);font-size:15px}
.hint{font-size:12px;color:var(--muted);text-align:center;padding:8px 14px 12px;flex:none}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="app">
    <div class="brand">
      <span id="hdrIcon"></span>
      <div>
        <h1 id="appTitle"></h1>
        <p class="tag" id="appTag"></p>
      </div>
    </div>
    <div class="hdr-right">
      <div class="seg" role="group" aria-label="Language" id="langSeg">
        <button type="button" data-l="kk" aria-pressed="false">KZ</button>
        <button type="button" data-l="ru" aria-pressed="false">RU</button>
        <button type="button" data-l="en" aria-pressed="true">EN</button>
      </div>
      <span class="pill" id="netPill"><i></i><span id="netTxt"></span></span>
    </div>
  </header>

  <div class="banner" id="banner" role="status" hidden></div>

  <div class="layout">
    <main class="card main">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" id="tab-tl" data-tab="tl" aria-selected="true"></button>
        <button type="button" role="tab" id="tab-fg" data-tab="fg" aria-selected="false"></button>
        <button type="button" role="tab" id="tab-qz" data-tab="qz" aria-selected="false"></button>
      </div>
      <div id="view" role="tabpanel" aria-live="polite"></div>
    </main>

    <aside class="card lab" aria-label="PWA lab">
      <div class="lab-in">
        <h2 id="labTitle"></h2>

        <section class="block" id="offBlock">
          <h3 id="offTitle"></h3>
          <p id="offDesc"></p>
          <div class="row">
            <button type="button" class="btn primary" id="saveBtn"></button>
            <button type="button" class="btn small" id="clearBtn"></button>
          </div>
          <div class="bar" aria-hidden="true"><i id="saveBar"></i></div>
          <label class="switch" for="simSwitch">
            <input type="checkbox" id="simSwitch" role="switch">
            <span class="trk"></span><span id="simLabel"></span>
          </label>
          <p id="simHint"></p>
          <div>
            <p class="note" id="cacheTitle" style="font-weight:600;margin-bottom:6px"></p>
            <ul class="entries" id="entries"></ul>
          </div>
        </section>

        <section class="block" id="insBlock">
          <h3 id="insTitle"></h3>
          <p id="insDesc"></p>
          <div class="row"><button type="button" class="btn gold" id="installBtn"></button></div>
          <div id="homeWrap" hidden></div>
        </section>

        <section class="block">
          <h3 id="logTitle"></h3>
          <ul class="log" id="log" role="log"></ul>
          <p class="note" id="strategy"></p>
        </section>

        <section class="block">
          <details>
            <summary id="codeTitle"></summary>
            <ul class="checks" id="checks" style="margin-top:10px"></ul>
            <pre id="manifestCode"></pre>
            <pre id="swCode"></pre>
            <p class="note" id="simNote" style="margin-top:10px"></p>
          </details>
        </section>
      </div>
    </aside>
  </div>
</div>

<div id="overlay"></div>

}

 timeline:[

var LS_CACHE="khw-offline-cache-v1",LS_LANG="khw-lang",LS_BEST="khw-best";

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function readCache(){var r=lsGet(LS_CACHE);if(r){try{return JSON.parse(r)}catch(e){}}return mem.cache}
function writeCache(o){mem.cache=o;lsSet(LS_CACHE,JSON.stringify(o))}
function clearCache(){mem.cache=null;lsDel(LS_CACHE)}

function $(id){return document.getElementById(id)}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function kb(o){return Math.max(.1,new Blob([JSON.stringify(o)]).size/1024)}
function fmtKB(n){return n.toFixed(1)+" KB"}
function clock(ts){return new Date(ts||Date.now()).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}
function clockS(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function online(){return !state.sim&&navigator.onLine!==false}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---------- the "service worker": network first, saved copy as fallback ---------- */
function addLog(path,src,size,note){
  state.log.unshift({t:clockS(),path:path,src:src,size:size,note:note||""});
  if(state.log.length>30)state.log.length=30;
  paintLog();
}
async function fetchResource(name){
  var path="GET /api/"+name;
  if(online()){
    await sleep(260);
    addLog(path,"network",kb(SERVER[name]));
    return SERVER[name];
  }
  await sleep(120);
  var c=readCache(),hit=c&&c.items&&c.items[name];
  if(hit){addLog(path,"cache",hit.kb);return hit.data}
  addLog(path,"fail",0);
  throw new Error("offline");
}

      '<div class="app"><div class="ph"></div><span>Notes</span></div>'+
      '<button type="button" class="app new" id="homeIcon" aria-label="'+esc(t("open")+": "+t("title"))+'">'+iconSVG()+'<span>'+esc(t("title"))+'</span></button>'+
      '</div><small>'+esc(t("homeAdded"))+'</small></div>';
    $("homeIcon").onclick=openStandalone;
  }else{hw.hidden=true;hw.innerHTML=""}
}
function paintLog(){
  var ul=$("log");
  if(!state.log.length){ul.innerHTML="";return}
  ul.innerHTML=state.log.slice(0,10).map(function(e){
    var lab=e.src==="network"?"NETWORK":e.src==="cache"?"CACHE":"FAILED";
    return'<li><time>'+e.t+'</time><code title="'+esc(e.path)+'">'+esc(e.path)+(e.size?" · "+fmtKB(e.size):"")+(e.note?" · "+esc(e.note):"")+'</code><span class="src '+e.src+'">'+lab+'</span></li>';
  }).join("");
}

/* ---------- rendering: content ---------- */
function skeleton(){$("view").innerHTML='<div class="skel" aria-hidden="true"><i style="width:40%"></i><i style="width:90%"></i><i style="width:75%"></i><i style="width:35%"></i><i style="width:85%"></i></div>'}
function failView(){
  var sim=state.sim;
  $("view").innerHTML='<div class="fail"><h3>'+esc(t("failTitle"))+'</h3><p>'+esc(t("failText"))+'</p>'+(sim?'<button type="button" class="btn primary" id="failBtn">'+esc(t("failBtn"))+'</button>':"")+'</div>';
  if(sim)$("failBtn").onclick=function(){setSim(false)};
}
function renderTimeline(d){
  $("view").innerHTML='<ol class="tl">'+d.map(function(e){var x=e[state.lang];return'<li><span class="yr">'+esc(e.y)+'</span><h3>'+esc(x.t)+'</h3><p>'+esc(x.d)+'</p></li>'}).join("")+"</ol>";
}
function renderFigures(d){
  $("view").innerHTML='<div class="figs">'+d.map(function(f){var x=f[state.lang];return'<article class="fig"><div class="mono" aria-hidden="true">'+esc(f.m[state.lang])+'</div><div><h3>'+esc(x.n)+'</h3><span class="life">'+esc(f.y)+'</span></div><span class="chip">'+esc(x.r)+'</span><p>'+esc(x.d)+'</p></article>'}).join("")+"</div>";
}
function renderQuiz(d){
  var q=state.quiz,n=d.length,v=$("view");
  if(q.done){
    v.innerHTML='<div class="quiz"><h3>'+esc(t("result",{s:q.score,n:n}))+'</h3><p class="fb">'+(best!=null?esc(t("best",{b:best+"/"+n})):"")+'</p><div><button type="button" class="btn primary" id="again">'+esc(t("again"))+'</button></div></div>';
    $("again").onclick=function(){state.quiz={i:0,score:0,pick:null,done:false};renderQuiz(d)};
    return;
  }
  var it=d[q.i],L=state.lang;
  var opts=it.o.map(function(o,i){
    var cls="opt";if(q.pick!=null){if(i===it.a)cls+=" right";else if(i===q.pick)cls+=" wrong"}
    return'<button type="button" class="'+cls+'" data-i="'+i+'"'+(q.pick!=null?" disabled":"")+'>'+esc(o[L])+'</button>';
  }).join("");
  var fb="";
  if(q.pick!=null)fb=q.pick===it.a?'<p class="fb ok">'+esc(t("right"))+'</p>':'<p class="fb bad">'+esc(t("wrong",{a:it.o[it.a][L]}))+'</p>';
  else fb='<p class="fb"></p>';
  v.innerHTML='<div class="quiz"><div class="meta"><span>'+esc(t("qOf",{i:q.i+1,n:n}))+'</span><span>'+esc(t("score",{s:q.score}))+'</span></div><h3>'+esc(it.q[L])+'</h3><div class="opts">'+opts+'</div>'+fb+
    (q.pick!=null?'<div><button type="button" class="btn primary" id="nextQ">'+esc(q.i===n-1?t("finish"):t("next"))+'</button></div>':"")+"</div>";
  v.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){
    var i=+b.dataset.i;q.pick=i;if(i===it.a)q.score++;renderQuiz(d);
  }});
  var nx=$("nextQ");
  if(nx)nx.onclick=function(){
    if(q.i===n-1){q.done=true;if(best==null||q.score>best){best=q.score;mem.best=best;lsSet(LS_BEST,String(best))}}
    else{q.i++;q.pick=null}
    renderQuiz(d);
  };
}
var lastData={};
async function loadTab(quiet){
  var mine=++state.seq,name={tl:"timeline",fg:"figures",qz:"quiz"}[state.tab];
  if(!quiet)skeleton();
  try{
    var d=await fetchResource(name);
    if(mine!==state.seq)return;
    lastData[name]=d;
    if(state.tab==="tl")renderTimeline(d);else if(state.tab==="fg")renderFigures(d);else renderQuiz(d);
  }catch(e){if(mine===state.seq)failView()}
}
function rerenderLang(){
  var name={tl:"timeline",fg:"figures",qz:"quiz"}[state.tab],d=lastData[name];
  if(!d){loadTab();return}
  if(state.tab==="tl")renderTimeline(d);else if(state.tab==="fg")renderFigures(d);else renderQuiz(d);
}

/* ---------- offline: save + simulate ---------- */
async function saveOffline(){
  if(!online()||state.saving)return;
  state.saving=true;paintLab();
  var items={},bar=$("saveBar");bar.style.width="0%";
  for(var i=0;i<NAMES.length;i++){
    await sleep(480);
    var n=NAMES[i],size=kb(SERVER[n]);
    items[n]={data:SERVER[n],kb:size};
    addLog("GET /api/"+n,"network",size,"stored in cache");
    bar.style.width=Math.round((i+1)/NAMES.length*100)+"%";
  }
  writeCache({savedAt:Date.now(),items:items});
  state.saving=false;paintLab();paintStatus();
  setTimeout(function(){bar.style.width="0%"},1400);
}
function setSim(v){
  state.sim=!!v;paintStatus();paintLab();loadTab();
}
window.addEventListener("online",function(){paintStatus();paintLab();loadTab()});
window.addEventListener("offline",function(){paintStatus();paintLab();loadTab()});

/* ---------- install ---------- */
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();state.deferred=e});
window.addEventListener("appinstalled",function(){state.installed=true;paintLab()});
function installClick(){
  if(state.installed){openStandalone();return}
  if(state.deferred){
    var p=state.deferred;state.deferred=null;
    try{p.prompt();p.userChoice.then(function(r){if(r&&r.outcome==="accepted"){state.installed=true;paintLab()}})}catch(e){openSheet()}
    return;
  }
  openSheet();
}
function openSheet(){
  var ov=$("overlay");
  ov.innerHTML='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">'+
    '<div class="top">'+iconSVG()+'<div><h2 id="shT">'+esc(t("sheetTitle"))+'</h2><div class="url">kazakh-history.example</div></div></div>'+
    '<p>'+esc(t("sheetText"))+'</p><div class="row"><button type="button" class="btn" id="shNo">'+esc(t("cancel"))+'</button><button type="button" class="btn gold" id="shYes">'+esc(t("add"))+'</button></div></div></div>';
  $("shYes").focus();
  $("shNo").onclick=closeOverlay;
  $("shYes").onclick=function(){state.installed=true;closeOverlay();paintLab();var h=$("homeIcon");if(h)h.focus()};
  $("scrim").onclick=function(e){if(e.target.id==="scrim")closeOverlay()};
}
function closeOverlay(){$("overlay").innerHTML="";var b=$("installBtn");if(b)b.focus()}
async function openStandalone(){
  var ov=$("overlay");
  ov.innerHTML='<div class="scrim" id="scrim"><div class="phone" role="dialog" aria-modal="true" aria-label="'+esc(t("title"))+'">'+
   '<div class="splash" id="splash">'+iconSVG()+'<span>'+esc(t("title"))+'</span></div>'+
   '<div class="sbar"><span>'+clock()+'</span><span id="sbNet"></span></div>'+
   '<div class="sapp"><header><h2>'+esc(t("title"))+'</h2><button type="button" class="btn small" id="stBack">'+esc(t("back"))+'</button></header><ul class="stl" id="stl"></ul></div>'+
   '<div class="hint">'+esc(t("standalone"))+'</div></div></div>';
  $("stBack").onclick=closeOverlay;
  $("sbNet").textContent=online()?"●●●● 5G":"○○○○ —";
  setTimeout(function(){var s=$("splash");if(s)s.classList.add("gone")},900);
  try{
    var d=await fetchResource("timeline");
    var ul=$("stl");if(ul)ul.innerHTML=d.slice(0,5).map(function(e){var x=e[state.lang];return'<li><span class="yr">'+esc(e.y)+'</span><b>'+esc(x.t)+'</b></li>'}).join("");
  }catch(e){var ul2=$("stl");if(ul2)ul2.innerHTML='<li><b>'+esc(t("failTitle"))+'</b>'+esc(t("failText"))+'</li>'}
  $("stBack").focus();
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("overlay").innerHTML)closeOverlay()});

/* ---------- code panels ---------- */
$("manifestCode").textContent='// manifest.json\n{\n  "name": "Kazakh History",\n  "short_name": "KZ History",\n  "start_url": "/?source=pwa",\n  "display": "standalone",\n  "background_color": "#0E2433",\n  "theme_color": "#0A8FB0",\n  "icons": [\n    { "src": "/icons/192.png", "sizes": "192x192", "type": "image/png" },\n    { "src": "/icons/512.png", "sizes": "512x512", "type": "image/png" }\n  ]\n}';
$("swCode").textContent="// sw.js\nconst CACHE = 'kazakh-history-v1';\nconst FILES = ['/', '/timeline', '/figures', '/quiz', '/app.js', '/style.css'];\n\nself.addEventListener('install', (event) => {\n  event.waitUntil(caches.open(CACHE).then((c) => c.addAll(FILES)));\n});\n\nself.addEventListener('fetch', (event) => {\n  event.respondWith(\n    fetch(event.request).catch(() => caches.match(event.request))\n  );\n});";

/* ---------- wiring ---------- */
$("hdrIcon").innerHTML=iconSVG();
document.querySelectorAll("#langSeg button").forEach(function(b){b.onclick=function(){
  state.lang=b.dataset.l;mem.lang=state.lang;lsSet(LS_LANG,state.lang);paintStatic();paintStatus();paintLab();rerenderLang();
}});
document.querySelectorAll("#tabs button").forEach(function(b){b.onclick=function(){
  state.tab=b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(function(x){x.setAttribute("aria-selected",x===b)});
  loadTab();
}});
$("saveBtn").onclick=saveOffline;
$("clearBtn").onclick=function(){clearCache();paintLab();paintStatus();loadTab(true)};
$("simSwitch").onchange=function(e){setSim(e.target.checked)};
$("installBtn").onclick=installClick;

paintStatic();paintStatus();paintLab();paintLog();loadTab();
})();
</script>

</body></html>
